<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit PT Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#e6dcc4; --tan:#cdbb8f; --paper:#fbf8ef; --ink:#23241f;
    --od:#4b5320; --od2:#6b7340; --gold:#e5b53b; --hivis:#dff23a; --red:#b3261e; --sand:#efe3c4; --grey:#cfcfc4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);background:var(--desk);user-select:none}
  button{font:inherit;color:inherit;cursor:pointer}
  img.px,.pximg{image-rendering:pixelated;image-rendering:crisp-edges}
  .ss{font-family:Silkscreen,monospace}
  .stencil{font-family:"Stardos Stencil",serif;font-weight:700;letter-spacing:1px}

  /* boot */
  #boot{position:fixed;inset:0;z-index:999;background:var(--od);display:grid;place-items:center;cursor:pointer;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}
  .bootbox{background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:26px 32px;text-align:center;width:min(380px,88vw)}
  .bootbox h1{font-family:Silkscreen;font-size:22px;margin:8px 0 2px}
  .star{font-size:40px;display:inline-block;color:var(--gold);text-shadow:2px 2px 0 var(--ink);animation:spin 6s steps(24) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loadbar{height:16px;border:2px solid var(--ink);margin:16px 0 10px;background:#fff;overflow:hidden}
  .loadbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--ink) 0 6px,var(--gold) 6px 12px);transition:width 2s steps(14)}
  #bootMsg{font-size:12px;min-height:16px}

  /* menu bar */
  .menubar{position:fixed;top:0;left:0;right:0;height:28px;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;z-index:500;font-family:"Pixelify Sans";font-size:15px}
  .menu{position:relative;height:100%}
  .menu>button{height:100%;padding:0 12px;border:0;background:none}
  .menu>button:hover,.menu.open>button{background:var(--ink);color:var(--paper)}
  .drop{position:absolute;top:26px;left:0;min-width:230px;background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:none;padding:4px 0}
  .menu.open .drop{display:block}
  .drop button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:none;padding:5px 14px}
  .drop button:hover{background:var(--ink);color:var(--paper)}
  .drop hr{border:0;border-top:1px dashed var(--ink);margin:4px 0}
  .mb-right{margin-left:auto;display:flex;gap:16px;padding-right:14px;align-items:center}
  .mb-right button{border:0;background:none}
  #nowMini{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}

  /* desktop */
  #desk{position:fixed;top:28px;left:0;right:0;bottom:0;overflow:hidden;background-color:var(--desk);
    background-image:radial-gradient(rgba(35,36,31,.12) 1px,transparent 1.2px);background-size:6px 6px}
  .hello{position:absolute;left:30px;bottom:28px;display:flex;align-items:flex-end;gap:22px;pointer-events:none}
  .photo{background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 8px 6px;transform:rotate(-2deg)}
  .photo img{display:block;width:320px;border:2px solid var(--ink)}
  .photo div{font-family:"Pixelify Sans";font-size:13px;margin-top:4px}
  .hello .big{font-family:Silkscreen;font-size:clamp(30px,4.6vw,60px);line-height:.95;color:var(--od);text-shadow:3px 3px 0 var(--gold)}
  .hello p{font-family:"Pixelify Sans";font-size:17px;margin-top:8px}
  .icons{position:absolute;top:16px;right:16px;display:grid;gap:12px;justify-items:center}
  .icon{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:4px}
  .icon .glyph{width:64px;height:56px;display:grid;place-items:center;position:relative}
  .icon .glyph img{max-width:60px;max-height:52px;image-rendering:pixelated}
  .icon span{font-family:"Pixelify Sans";font-size:13px;padding:1px 5px;background:var(--paper);text-align:center;line-height:1.2}
  .icon:hover span,.icon:focus span{background:var(--ink);color:var(--paper)}
  .stamp{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(-12deg);font-family:Silkscreen;font-size:9px;color:var(--red);border:2px solid var(--red);padding:0 3px;background:rgba(255,255,255,.7)}

  /* windows */
  .win{position:absolute;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;max-height:calc(100% - 20px);animation:pop .14s steps(3)}
  @keyframes pop{from{transform:scale(.92);opacity:0}}
  .tbar{height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px;border-bottom:2px solid var(--ink);cursor:grab;touch-action:none;
    background:repeating-linear-gradient(0deg,var(--ink) 0 1px,transparent 1px 3px) center/100% 12px no-repeat,var(--paper)}
  .win:not(.focus) .tbar{background:var(--paper)}
  .tbar .close{width:14px;height:14px;border:2px solid var(--ink);background:var(--paper);flex:none;padding:0}
  .tbar .close:hover{background:var(--red)}
  .tbar .title{margin:0 auto;background:var(--paper);padding:0 10px;font-family:"Pixelify Sans";font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbar .spacer{width:14px;flex:none}
  .wbody{overflow:auto;flex:1;user-select:text}
  .wbody::-webkit-scrollbar{width:14px}
  .wbody::-webkit-scrollbar-track{background:repeating-linear-gradient(45deg,var(--paper) 0 2px,#e4dccb 2px 4px);border-left:2px solid var(--ink)}
  .wbody::-webkit-scrollbar-thumb{background:var(--paper);border:2px solid var(--ink)}

  .btn{border:2px solid var(--ink);background:var(--paper);padding:6px 14px;border-radius:6px;font-family:"Pixelify Sans";font-size:15px;box-shadow:2px 2px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  .btn.main{background:var(--gold)}
  .btn.od{background:var(--od);color:#fff}
  .btn.full{width:100%}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;border:2px solid var(--ink);background:#fff;padding:6px 8px;width:100%}

  /* supply */
  .tabs{display:flex;border-bottom:2px solid var(--ink);background:var(--tan);flex-wrap:wrap}
  .tab{border:0;border-right:2px solid var(--ink);background:none;padding:6px 12px;font-family:"Pixelify Sans";font-size:14px}
  .tab.on{background:var(--paper)}
  .shopbar{display:flex;gap:8px;padding:10px;border-bottom:1px dashed var(--ink);align-items:center}
  .shopbar input{max-width:220px}.shopbar select{max-width:170px}
  .shopbar .n{margin-left:auto;opacity:.7;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px}
  .item{border:2px solid var(--ink);background:#fff;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
  .item:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
  .th{aspect-ratio:1;display:grid;place-items:center;border-bottom:2px solid var(--ink);position:relative;width:100%;overflow:hidden}
  .th img{image-rendering:pixelated;width:78%;height:78%;object-fit:contain}
  .th img.tile{width:100%;height:100%;object-fit:cover}
  .item .nm{font-family:"Pixelify Sans";font-size:14px;font-weight:600;padding:6px 8px 0;line-height:1.15}
  .item .pr{padding:2px 8px 8px;font-size:12px}
  .item .pr s{opacity:.5;margin-left:4px}
  .badge{position:absolute;top:6px;left:6px;font-family:Silkscreen;font-size:10px;background:var(--gold);border:2px solid var(--ink);padding:1px 5px;z-index:2}
  .badge.out{background:var(--ink);color:var(--paper)}
  .badge.sale{background:var(--hivis)}
  .badge.ess{background:var(--od);color:#fff}
  .sold{opacity:.6}

  .pv{display:grid;grid-template-columns:1fr 1fr}
  .pv .th{border-bottom:0;border-right:2px solid var(--ink);min-height:300px;aspect-ratio:auto}
  .pv .meta{padding:16px;display:flex;flex-direction:column;gap:10px}
  .pv h2{font-family:Silkscreen;font-size:20px;line-height:1.1}
  .lbl{font-family:"Pixelify Sans";font-weight:600;font-size:14px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .sz{min-width:40px;height:32px;border:2px solid var(--ink);background:#fff;font-family:"Pixelify Sans";font-size:14px}
  .sz.on{background:var(--ink);color:var(--paper)}
  .hint{color:var(--red);min-height:16px;font-size:12px}
  .nsn{font-size:11px;opacity:.6}

  /* hand receipt */
  .hr-head{display:grid;grid-template-columns:1fr auto;padding:8px 12px;background:var(--sand);border-bottom:2px solid var(--ink);font-size:11px}
  .cline{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px dashed var(--ink)}
  .cline .mini{width:52px;height:52px;border:2px solid var(--ink);display:grid;place-items:center;overflow:hidden}
  .cline .mini img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  .cline .mini img.tile{object-fit:cover}
  .qty{display:flex;gap:6px;align-items:center;margin-top:4px}
  .qty button{width:22px;height:22px;border:2px solid var(--ink);background:#fff;padding:0;line-height:1}
  .link{border:0;background:none;text-decoration:underline;font-size:12px;opacity:.7}
  .tot{padding:12px;display:grid;gap:6px}
  .row{display:flex;justify-content:space-between}
  .row.big{font-family:"Pixelify Sans";font-size:18px;font-weight:600}
  .meter{height:14px;border:2px solid var(--ink);background:#fff}
  .meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--ink) 0 5px,var(--gold) 5px 10px)}

  /* SINCGARS */
  .sinc{background:#3b4120;padding:10px;display:grid;gap:10px}
  .panel{position:relative;background:#59612f;border:2px solid var(--ink);padding:4px;box-shadow:inset 0 0 0 2px #6b7340}
  .panel img{display:block;width:100%;image-rendering:pixelated}
  .hs{position:absolute;border:0;background:transparent;padding:0;border-radius:50%}
  .hs.key{border-radius:2px}
  .hs:hover,.hs:focus-visible{outline:2px dashed var(--gold);outline-offset:1px}
  .hs .tick{position:absolute;left:50%;top:6%;width:3px;height:44%;background:var(--gold);transform-origin:50% 100%;margin-left:-1.5px;box-shadow:0 0 0 1px var(--ink);transition:transform .15s steps(3)}
  .hs .tip{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:Silkscreen;font-size:9px;padding:1px 4px;white-space:nowrap;opacity:0;pointer-events:none;margin-bottom:2px}
  .hs:hover .tip{opacity:1}
  .lcd{position:absolute;background:#9fb07a;color:#1d2410;font-family:Silkscreen;overflow:hidden;white-space:nowrap;display:flex;align-items:center;box-shadow:inset 0 0 0 1px #1d2410}
  .lcd span{display:inline-block;padding-left:100%;animation:scroll 9s linear infinite}
  .lcd.off{background:#2a2f1c}.lcd.off span{visibility:hidden}
  @keyframes scroll{to{transform:translateX(-100%)}}
  .readout{background:#9fb07a;border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #7d8d5a;padding:8px 10px;font-family:"Pixelify Sans";font-size:15px;color:#1d2410;min-height:74px}
  .readout small{display:block;font-family:Silkscreen;font-size:10px;opacity:.85}
  .readout.off{background:#2a2f1c;color:#2a2f1c}
  .eq{display:flex;gap:3px;align-items:flex-end;height:22px;margin-top:6px}
  .eq i{flex:1;background:#1d2410;height:8%}
  .sinc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ptt{background:var(--ink);color:var(--hivis);border:2px solid #000;border-radius:999px;padding:8px 16px;font-family:Silkscreen;font-size:12px;box-shadow:0 3px 0 #000}
  .ptt:active{transform:translateY(3px);box-shadow:none}
  .nets{display:grid;gap:4px}
  .net{display:flex;gap:8px;align-items:center;border:2px solid var(--ink);background:var(--sand);padding:5px 8px;text-align:left;font-family:"Pixelify Sans";font-size:14px}
  .net.on{background:var(--gold)}
  .net small{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;opacity:.7}
  .plate{color:#e9e5cf;font-size:11px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  input[type=range]{padding:0;border:0;background:none;accent-color:var(--gold);max-width:130px}

  .doc{padding:16px;display:grid;gap:10px;line-height:1.55}
  .doc h2{font-family:Silkscreen;font-size:17px}
  .doc b{font-family:"Pixelify Sans"}
  .class-bar{background:var(--red);color:#fff;text-align:center;font-family:Silkscreen;font-size:11px;padding:2px}
  .class-bar.u{background:#2f7d32}
  .dlg{padding:18px;display:grid;gap:12px;text-align:center}
  .credits li{margin:0 0 8px 16px}
  .credits a{color:var(--od)}
  .confetti{position:fixed;top:-20px;z-index:900;pointer-events:none;animation:fall linear forwards;font-size:18px}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  @media (max-width:760px){
    #nowMini{display:none}
    .menu>button{padding:0 7px}
    .icons{grid-template-columns:repeat(6,1fr);right:auto;left:0;width:100%;top:8px;gap:0}
    .icon{width:auto;padding:2px}
    .icon .glyph{width:44px;height:38px}
    .icon .glyph img{max-width:40px;max-height:34px}
    .icon span{font-size:10px;padding:1px 2px}
    .stamp{display:none}
    .win{left:6px!important;right:6px;width:auto!important;top:96px!important;max-height:calc(100% - 104px)}
    .tbar{cursor:default}
    .pv{grid-template-columns:1fr}
    .pv .th{border-right:0;border-bottom:2px solid var(--ink);min-height:220px}
    .hello{display:none}
  }
</style>
</head>
<body>

<div id="boot">
  <div class="bootbox">
    <div class="star">★</div>
    <h1>UNIT PT SUPPLY</h1>
    <div style="font-family:'Pixelify Sans';font-size:15px">Hooah. Sign for it.</div>
    <div class="loadbar"><i id="loadI"></i></div>
    <div id="bootMsg">Conducting PCCs…</div>
  </div>
</div>

<div class="menubar">
  <div class="menu"><button>★</button><div class="drop">
    <button data-open="opord">OPORD (About)</button>
    <button data-open="credits">Image credits</button><hr>
    <button data-open="radio">SINCGARS</button>
  </div></div>
  <div class="menu"><button>Supply</button><div class="drop">
    <button data-cat="All">Everything</button>
    <button data-cat="Tops">Tops</button>
    <button data-cat="Bottoms">Bottoms</button>
    <button data-cat="Headgear">Headgear</button>
    <button data-cat="Gear">Gear</button><hr>
    <button data-cat="Clearance">Clearance (DRMO)</button>
  </div></div>
  <div class="menu"><button>Commo</button><div class="drop">
    <button data-open="radio">Open SINCGARS</button>
    <button id="mPlay">Power on / off <span>␣</span></button>
    <button id="mCheck">Radio check</button>
  </div></div>
  <div class="menu"><button>S1</button><div class="drop">
    <button data-open="move">Movement (shipping)</button>
    <button data-open="turnin">Turn-in (returns)</button>
    <button data-open="sizes">Size guide</button>
  </div></div>
  <div class="mb-right">
    <span id="nowMini"></span>
    <button data-open="cart">📋 <span id="count">0</span></button>
    <span id="clock"></span>
  </div>
</div>

<div id="desk">
  <div class="hello">
    <div class="photo"><img class="px" id="heroImg" alt="Soldiers running in PT uniforms, pixelated"><div>0530_formation.png</div></div>
    <div><div class="big">Embrace<br>the suck.</div><p>Look good. Run fast. Sign for it. ★</p></div>
  </div>
  <div class="icons" id="icons"></div>
</div>

/* ================= WINDOW MANAGER ================= */
const $=id=>document.getElementById(id);
const desk=$("desk"); let z=10; const wins={};
const mobile=()=>innerWidth<=760;
function openWin(id,title,{w=420,x,y,render}){
  if(wins[id]){focus(wins[id]); if(render)render(wins[id].querySelector(".wbody")); return wins[id]}
  const el=document.createElement("div"); el.className="win"; el.style.width=w+"px";
  const n=Object.keys(wins).length;
  el.style.left=(x??Math.max(10,Math.min(desk.clientWidth-w-130,60+n*28)))+"px";
  el.style.top=(y??Math.max(10,20+n*24))+"px";
  el.innerHTML=`<div class="tbar"><button class="close" aria-label="Close"></button><div class="title">${title}</div><div class="spacer"></div></div><div class="wbody"></div>`;
  desk.appendChild(el); wins[id]=el; focus(el);
  el.addEventListener("pointerdown",()=>focus(el));
  el.querySelector(".close").onclick=e=>{e.stopPropagation();closeWin(id)};
  drag(el); if(render)render(el.querySelector(".wbody")); return el;
}
function closeWin(id){if(wins[id]){wins[id].remove();delete wins[id]}}
function focus(el){Object.values(wins).forEach(w=>w.classList.remove("focus"));el.classList.add("focus");el.style.zIndex=++z}
function drag(el){
  const bar=el.querySelector(".tbar"); let sx,sy,ox,oy,on=false;
  bar.addEventListener("pointerdown",e=>{if(mobile()||e.target.closest(".close"))return;on=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;bar.setPointerCapture(e.pointerId);bar.style.cursor="grabbing"});
  bar.addEventListener("pointermove",e=>{if(!on)return;
    el.style.left=Math.max(-el.offsetWidth+80,Math.min(desk.clientWidth-80,ox+e.clientX-sx))+"px";
    el.style.top=Math.max(0,Math.min(desk.clientHeight-30,oy+e.clientY-sy))+"px"});
  bar.addEventListener("pointerup",()=>{on=false;bar.style.cursor=""});
}
function rerender(id,fn){if(wins[id])fn(wins[id].querySelector(".wbody"))}
const pimg=(p,cls="")=>`<img src="${SPR[p.img]}" class="${p.tile?'tile':''} ${cls}" alt="${p.name}, pixelated photo">`;

/* ================= SUPPLY ================= */
const money=n=>"$"+n.toFixed(2);
let cat="All",query="",sort="feat";
function openShop(c){ if(c)cat=c; openWin("shop","Supply Room — "+UNIT,{w:640,x:mobile()?6:30,y:mobile()?96:16,render:renderShop}); }
function renderShop(b){
  let list=PRODUCTS.filter(p=>cat==="All"||(cat==="Clearance"?p.was:p.cat===cat)).filter(p=>(p.name+p.cat+p.desc).toLowerCase().includes(query.toLowerCase()));
  if(sort==="lo")list.sort((a,c)=>a.price-c.price); if(sort==="hi")list.sort((a,c)=>c.price-a.price);
  const keep=document.activeElement&&document.activeElement.id==="q";
  b.innerHTML=`<div class="tabs">${CATS.map(c=>`<button class="tab ${c===cat?'on':''}" data-t="${c}">${c}</button>`).join("")}</div>
   <div class="shopbar"><input id="q" placeholder="Search supply…" value="${query}"><select id="sort">
     <option value="feat">Featured</option><option value="lo">Price ↑</option><option value="hi">Price ↓</option></select>
     <span class="n">${list.length} line item${list.length===1?"":"s"}</span></div>
   <div class="grid">${list.map(p=>{
     const bd=p.soldOut?`<span class="badge out">Back-ordered</span>`:p.was?`<span class="badge sale">DRMO deal</span>`:p.ess?`<span class="badge ess">${p.tag}</span>`:p.tag?`<span class="badge">${p.tag}</span>`:"";
     return `<button class="item ${p.soldOut?'sold':''}" data-p="${p.id}"><div class="th" style="background:${p.bg||'#fff'}">${bd}${pimg(p)}</div>
       <div class="nm">${p.name}</div><div class="pr">${money(p.price)}${p.was?`<s>${money(p.was)}</s>`:""}</div></button>`}).join("")||`<p style="padding:20px">Supply has none of that. Supply never has any of that.</p>`}</div>`;
  b.querySelector("#sort").value=sort;
  b.querySelectorAll("[data-t]").forEach(t=>t.onclick=()=>{cat=t.dataset.t;renderShop(b)});
  b.querySelectorAll("[data-p]").forEach(t=>t.onclick=()=>openProduct(+t.dataset.p));
  const q=b.querySelector("#q"); q.oninput=e=>{query=e.target.value;renderShop(b)};
  if(keep){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  b.querySelector("#sort").onchange=e=>{sort=e.target.value;renderShop(b)};
}
const sel={};
function openProduct(id){
  const p=PRODUCTS.find(x=>x.id===id); sel[id]=sel[id]||{s:p.sizes.length===1?p.sizes[0]:null};
  const shop=wins.shop;
  openWin("p"+id,p.name,{w:560,x:shop?shop.offsetLeft+70:120,y:shop?shop.offsetTop+44:60,render:b=>renderProduct(b,p)});
}
function renderProduct(b,p){
  const st=sel[p.id];
  b.innerHTML=`<div class="pv"><div class="th" style="background:${p.bg||'#fff'}">${pimg(p)}</div>
   <div class="meta"><div class="ss" style="font-size:11px;opacity:.6">${p.cat}</div><h2>${p.name}</h2>
    <div style="font-family:'Pixelify Sans';font-size:20px;font-weight:600">${money(p.price)} ${p.was?`<s style="opacity:.5;font-size:15px">${money(p.was)}</s>`:""}</div>
    <p>${p.desc}</p>
    <div class="nsn">NSN (not real): ${p.nsn}</div>
    <div><div class="lbl">Size</div><div class="opts">${p.sizes.map(s=>`<button class="sz ${s===st.s?'on':''}" data-s="${s}">${s}</button>`).join("")}</div></div>
    <div class="hint" id="h${p.id}"></div>
    <button class="btn main full" id="add${p.id}" ${p.soldOut?"disabled":""}>${p.soldOut?"Back-ordered":"Add to hand receipt"}</button>
   </div></div>`;
  b.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{st.s=x.dataset.s;renderProduct(b,p)});
  b.querySelector("#add"+p.id).onclick=()=>{
    if(!st.s){b.querySelector("#h"+p.id).textContent="Size, Private. Pick one.";return}
    const key=`${p.id}-${st.s}`, ex=cart.find(i=>i.key===key);
    ex?ex.qty++:cart.push({key,id:p.id,s:st.s,qty:1}); saveCart();
    closeWin("p"+p.id); openCart(); burst(10);
  };
}

let cart=[]; try{cart=JSON.parse(localStorage.getItem("ptsupply-cart")||"[]")}catch(e){}

/* ================= SINCGARS (synth radio, Web Audio) ================= */
const NETS=[
  {name:"0530 PT NET",sub:"motivated synths",freq:"30.050",bpm:116,wave:"square",prog:[[57,60,64,69],[53,57,60,65],[55,59,62,67],[52,56,59,64]],arp:true},
  {name:"RUCK MARCH NET",sub:"cadence drums",freq:"45.300",bpm:120,wave:"triangle",prog:[[50,57,62,65],[48,55,60,64],[46,53,58,62],[45,52,57,61]],snare:true},
  {name:"CQ NIGHT NET",sub:"quiet hours lo-fi",freq:"72.875",bpm:74,wave:"sine",prog:[[50,57,60,65],[48,55,58,64],[53,57,60,64],[52,55,59,62]]},
];
const TRACKS=["Hurry Up and Wait","Zero Dark Thirty","Lima Charlie Love","PCS Blues","Field Day Funk","Embrace the Suck (Remix)","Chow Hall Serenade","Ruck Up, Buttercup","Smoke Session at Dawn","Sensitive Items Check"];
let ac=null,master,analyser,powered=false,net=0,timer=null,step=0,nextT=0,vol=.6,mode="SC",track=TRACKS[0],lcdMsg=null,lcdTimer=null,entry="";
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=vol*.5;
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;
  const bp=ac.createBiquadFilter();bp.type="highpass";bp.frequency.value=90; // a bit of radio "thin-ness"
  const dl=ac.createDelay();dl.delayTime.value=.27;const fb=ac.createGain();fb.gain.value=.22;
  analyser=ac.createAnalyser();analyser.fftSize=64;
  master.connect(lp);lp.connect(bp);bp.connect(analyser);analyser.connect(ac.destination);
  bp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(analyser);
}
function tone(m,t,dur,type,g){const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=hz(m);o.detune.value=(Math.random()-.5)*8;
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.03);e.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(e);e.connect(master);o.start(t);o.stop(t+dur+.05)}
function noise(t,dur,f,g,type="highpass"){const len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource();s.buffer=buf;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const gn=ac.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(master);s.start(t)}
function kick(t){const o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);e.gain.setValueAtTime(.4,t);e.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(e);e.connect(master);o.start(t);o.stop(t+.3)}
function schedule(){
  const n=NETS[net], eighth=60/n.bpm/2;
  while(nextT<ac.currentTime+.2){
    const bar=Math.floor(step/8)%n.prog.length,pos=step%8,ch=n.prog[bar];
    if(pos===0){ch.forEach(m=>tone(m,nextT,eighth*7.5,n.wave==="square"?"triangle":n.wave,.06));tone(ch[0]-12,nextT,eighth*3,"sine",.17)}
    if(pos===4)tone(ch[0]-12,nextT,eighth*3,"sine",.13);
    if(n.arp)tone(ch[pos%4]+12,nextT,eighth*.8,"square",.022);
    else if(!n.snare&&(pos===3||pos===6))tone(ch[(pos+step)%4]+12,nextT,eighth*2,"triangle",.05);
    if(n.snare){ if(pos===0||pos===4)kick(nextT); if(pos===2||pos===6)noise(nextT,.16,1800,.25,"bandpass"); if(pos===7&&bar%2)noise(nextT+eighth/2,.08,1800,.15,"bandpass"); }
    else { if(pos===0||pos===4)kick(nextT); if(pos%2===1)noise(nextT,.04,7000,.06); }
    nextT+=eighth*(n.snare?1:(pos%2?.92:1.08)); step++;
    if(step%64===0){track=TRACKS[Math.floor(Math.random()*TRACKS.length)];updateRadio()}
  }
}
function powerOn(){ if(!ac)initAudio(); ac.resume(); powered=true; nextT=ac.currentTime+.05; clearInterval(timer); timer=setInterval(schedule,50); squelch(); flash("SQ ON · "+NETS[net].name); updateRadio(); }
function powerOff(){ powered=false; clearInterval(timer); updateRadio(); }
function togglePower(){ powered?powerOff():powerOn() }
function squelch(){ if(ac) noise(ac.currentTime,.12,1200,.18,"bandpass") }
function setNet(i){ net=i; step=0; track=TRACKS[(i*3)%TRACKS.length]; if(powered){nextT=ac.currentTime+.05;squelch()} flash("CH "+(i+1)+" · "+NETS[i].freq); updateRadio(); }
function flash(msg,ms=2200){lcdMsg=msg;clearTimeout(lcdTimer);lcdTimer=setTimeout(()=>{lcdMsg=null;updateRadio()},ms);updateRadio()}

const CHECKS=["Read you Lima Charlie, out.","Read you loud and clear, out.","Weak but readable. Moving on, out.","Say again all after 'radio', over.","Stop breaking squelch, over.","Unknown station, identify, over.","This is the 1SG. Get off the net, over."];
let log=[];
function radioCheck(){
  openRadio(); if(!powered){flash("NO POWER · TURN FCTN KNOB");return}
  squelch(); log=[["YOU","Any station this net, this is "+UNIT.split(" ")[0]+" 6, radio check, over."]]; updateRadio();
  setTimeout(()=>{squelch();log.push(["NET",CHECKS[Math.floor(Math.random()*CHECKS.length)]]);updateRadio()},1300);
}

const HS=[

];
const KEYS=[["1","2","3","FREQ"],["4","5","6","OFST"],["7","8","9","TIME"],["CLR","0","STO","BATT"]];
const KX=[91,99,107,116],KY=[35,43,52,60];
let knobAng={chan:-40,mode:0,fctn:-60,vol:20};
function pct(v,t){return (v/t*100)+"%"}
function openRadio(){openWin("radio","SINCGARS RT-1523 (ish)",{w:600,x:mobile()?6:Math.max(10,desk.clientWidth-740),y:mobile()?96:Math.max(16,desk.clientHeight-560),render:renderRadio})}
function renderRadio(b){
  const hs=HS.map(h=>`<button class="hs" data-h="${h.id}" style="left:${pct(h.x-h.r,PW)};top:${pct(h.y-h.r,PH)};width:${pct(h.r*2,PW)};height:${pct(h.r*2,PH)}" aria-label="${h.label}"><span class="tick" style="transform:rotate(${knobAng[h.id]}deg)"></span><span class="tip">${h.label}</span></button>`).join("");
  const keys=KEYS.map((row,ry)=>row.map((k,rx)=>`<button class="hs key" data-k="${k}" style="left:${pct(KX[rx]-3.6,PW)};top:${pct(KY[ry]-3.6,PH)};width:${pct(7.2,PW)};height:${pct(7.2,PH)}" aria-label="Key ${k}"><span class="tip">${k}</span></button>`).join("")).join("");
  b.innerHTML=`<div class="sinc">
    <div class="panel"><img src="${SPR.panel}" alt="Pixelated photo of a SINCGARS RT-1523 radio">${hs}${keys}
      <div class="lcd ${powered?'':'off'}" id="lcd" style="left:${pct(87.5,PW)};top:${pct(20,PH)};width:${pct(28.5,PW)};height:${pct(7,PH)}"><span id="lcdText"></span></div></div>
    <div class="readout ${powered?'':'off'}" id="readout"></div>
    <div class="sinc-row">
      <button class="btn ${powered?'':'main'}" id="pwr">${powered?"FCTN: OFF":"FCTN: SQ ON ⏻"}</button>
      <button class="ptt" id="ptt">PUSH TO TALK</button>
      <label class="plate" style="align-items:center">VOL <input type="range" id="vol" min="0" max="1" step=".01" value="${vol}" aria-label="Volume"></label>
    </div>
    <div class="nets">${NETS.map((n,i)=>`<button class="net ${i===net?'on':''}" data-n="${i}">CH ${i+1} · ${n.name}<small>${n.freq} MHz · ${n.sub}</small></button>`).join("")}</div>
    <div class="plate"><span class="stencil">PROPERTY OF SUPPLY · SIGN FOR IT</span><span>Click the knobs &amp; keys on the radio ↑</span></div>
  </div>`;
  b.querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>knob(x.dataset.h));
  b.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>key(x.dataset.k));
  b.querySelectorAll("[data-n]").forEach(x=>x.onclick=()=>{setNet(+x.dataset.n);if(!powered)powerOn()});
  b.querySelector("#pwr").onclick=()=>{knobAng.fctn=powered?-60:30;togglePower()};
  b.querySelector("#ptt").onclick=radioCheck;
  b.querySelector("#vol").oninput=e=>{vol=+e.target.value;if(master)master.gain.value=vol*.5};
  paintReadout();
}
function paintReadout(){
  const lt=document.getElementById("lcdText"), ro=document.getElementById("readout");
  if(lt) lt.textContent=lcdMsg||`CH${net+1} ${mode} ${NETS[net].freq} ♪ ${track}`;
  if(ro){
    ro.className="readout "+(powered?"":"off");
    ro.innerHTML=`<small>RT-1523 · CH ${net+1} · ${mode} · ${NETS[net].freq} MHz · ${NETS[net].name}</small>`+
      (log.length?log.map(([w,t])=>`<div>${w}: ${t}</div>`).join(""):`<div>${powered?"♪ "+track:"Radio off."}</div>`)+
      (entry?`<div>FREQ ENTRY: ${entry}_</div>`:"")+`<div class="eq" id="eq">${"<i></i>".repeat(20)}</div>`;
  }
}
function updateRadio(){ if(wins.radio){ const l=document.getElementById("lcd"); if(l)l.className="lcd "+(powered?"":"off"); paintReadout();
    const p=wins.radio.querySelector("#pwr"); if(p){p.textContent=powered?"FCTN: OFF":"FCTN: SQ ON ⏻";p.className="btn "+(powered?"":"main")}
    wins.radio.querySelectorAll("[data-n]").forEach((x,i)=>x.classList.toggle("on",i===net));
    wins.radio.querySelectorAll("[data-h]").forEach(x=>x.querySelector(".tick").style.transform=`rotate(${knobAng[x.dataset.h]}deg)`); }
  $("nowMini").textContent=powered?`📻 CH${net+1} ♪ ${track}`:"";
}
function knob(id){
  if(id==="fctn"){knobAng.fctn=powered?-60:30;togglePower();return}
  if(!powered){knobAng[id]+=30;flash("NO POWER · TURN FCTN KNOB");return}
  if(id==="chan"){setNet((net+1)%NETS.length);knobAng.chan=-40+net*40}
  if(id==="mode"){mode=mode==="SC"?"FH":"SC";knobAng.mode=mode==="SC"?0:45;flash(mode==="FH"?"FH · HOPPING BETWEEN BANGERS":"SC · SINGLE CHANNEL")}
  if(id==="vol"){const steps=[.25,.6,1];vol=steps[(steps.indexOf(steps.find(s=>s>=vol))+1)%3]||.25;if(master)master.gain.value=vol*.5;knobAng.vol=-60+vol*120;flash("VOL "+Math.round(vol*100)+"%");rerender("radio",renderRadio)}
  updateRadio();
}
function key(k){
  if(!powered){flash("NO POWER · TURN FCTN KNOB");return}
  if(["1","2","3"].includes(k)&&!entry){setNet(+k-1);knobAng.chan=-40+net*40;return}
  if(/^\d$/.test(k)){entry=(entry+k).slice(-5);flash("FREQ "+entry);paintReadout();return}
  if(k==="CLR"){entry="";log=[];flash("CLEARED");return}
  if(k==="STO"){flash(entry?"STORED "+entry+" · LIKE YOUR TA-50":"NOTHING TO STORE");entry="";return}
  if(k==="FREQ"){flash("FREQ "+NETS[net].freq+" MHz");return}
  if(k==="TIME"){flash("TIME "+milTime()+" · YOU'RE LATE");return}
  if(k==="OFST"){flash("OFFSET · LIKE YOUR PT SCORE");return}
  if(k==="BATT"){flash("BATT 12% · WHO SIGNED FOR THIS?");return}
}
(function eqLoop(){
  const eq=document.getElementById("eq");
  if(eq&&analyser&&powered){const d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);[...eq.children].forEach((bar,i)=>bar.style.height=Math.max(6,d[i+1]/255*100)+"%")}
  requestAnimationFrame(eqLoop);
})();

document.addEventListener("keydown",e=>{if(e.code==="Space"&&!/INPUT|SELECT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();knobAng.fctn=powered?-60:30;togglePower()}});

function milTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")}
function clock(){$("clock").textContent=milTime()+" HRS"} clock(); setInterval(clock,10000);

function burst(n,set=["★","✦","■","●"]){
  const cols=["#e5b53b","#4b5320","#dff23a","#23241f","#cdbb8f"];
  for(let i=0;i<n;i++){const e=document.createElement("div");e.className="confetti";e.textContent=set[i%set.length];
    e.style.left=Math.random()*100+"vw";e.style.color=cols[i%cols.length];e.style.fontSize=(14+Math.random()*18)+"px";
    e.style.animationDuration=(1.8+Math.random()*1.8)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
}

/* ================= BOOT ================= */
const BOOT=["Conducting PCCs…","Accounting for sensitive items…","Locating the reflective belt…","Formation is at 0530. Be there at 0515.","Ready. Click anywhere to report in. ★"];
let bi=0; requestAnimationFrame(()=>$("loadI").style.width="100%");
const bt=setInterval(()=>{bi++;$("bootMsg").textContent=BOOT[Math.min(bi,4)];if(bi>=4)clearInterval(bt)},420);
let booted=false;
function enter(){if(booted)return;booted=true;$("boot").classList.add("gone");openShop("All");if(!mobile())openRadio()}
$("boot").onclick=enter;
saveCart();
