<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northline Apparel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f9efe4; --pink:#f6d5d5; --ink:#2a2420; --paper:#fffaf3;
    --mint:#bfe6d3; --sky:#bcdff5; --butter:#fbe7a1; --coral:#f2a490; --lilac:#d6c8f0; --hot:#e8577a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);background:var(--cream);user-select:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .px{font-family:"Pixelify Sans",monospace}
  .ss{font-family:Silkscreen,monospace}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;z-index:999;background:var(--pink);display:grid;place-items:center;cursor:pointer;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}
  .bootbox{background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:28px 36px;text-align:center;width:min(340px,86vw)}
  .sun{font-size:46px;line-height:1;display:inline-block;animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bootbox h1{font-family:Silkscreen;font-size:22px;margin:10px 0 4px}
  .loadbar{height:14px;border:2px solid var(--ink);margin:16px 0 10px;background:#fff;overflow:hidden}
  .loadbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--hot) 0 6px,var(--coral) 6px 12px);transition:width 1.4s steps(12)}
  #bootMsg{font-size:12px}

  /* ---------- menu bar ---------- */
  .menubar{position:fixed;top:0;left:0;right:0;height:28px;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;z-index:500;font-family:"Pixelify Sans";font-size:15px}
  .menu{position:relative;height:100%}
  .menu>button{height:100%;padding:0 12px;border:0;background:none}
  .menu>button:hover,.menu.open>button{background:var(--ink);color:var(--paper)}
  .drop{position:absolute;top:26px;left:0;min-width:200px;background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:none;padding:4px 0}
  .menu.open .drop{display:block}
  .drop button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:5px 14px}
  .drop button:hover{background:var(--ink);color:var(--paper)}
  .drop hr{border:0;border-top:1px dashed var(--ink);margin:4px 0}
  .mb-right{margin-left:auto;display:flex;gap:16px;padding-right:14px;align-items:center}
  .mb-right button{border:0;background:none}
  #nowMini{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}

  /* ---------- desktop ---------- */
  #desk{position:fixed;top:28px;left:0;right:0;bottom:0;overflow:hidden;
    background-color:var(--cream);
    background-image:radial-gradient(rgba(42,36,32,.09) 1px,transparent 1.2px);background-size:6px 6px}
  .hello{position:absolute;left:36px;bottom:34px;pointer-events:none}
  .hello .big{font-family:Silkscreen;font-size:clamp(34px,6vw,72px);line-height:.95;color:var(--hot);text-shadow:3px 3px 0 var(--ink)}
  .hello p{font-family:"Pixelify Sans";font-size:17px;margin-top:8px}
  .icons{position:absolute;top:18px;right:18px;display:grid;grid-auto-flow:row;gap:14px;justify-items:center}
  .icon{width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:4px}
  .icon .glyph{width:52px;height:52px;display:grid;place-items:center}
  .icon span{font-family:"Pixelify Sans";font-size:13px;padding:1px 5px;background:var(--paper);border:1px solid transparent;text-align:center;line-height:1.2}
  .icon:hover span,.icon:focus span{background:var(--ink);color:var(--paper)}

  /* ---------- windows ---------- */
  .win{position:absolute;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;max-height:calc(100% - 20px);animation:pop .14s steps(3)}
  @keyframes pop{from{transform:scale(.92);opacity:0}}
  .tbar{height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px;border-bottom:2px solid var(--ink);cursor:grab;touch-action:none;
    background:repeating-linear-gradient(0deg,var(--ink) 0 1px,transparent 1px 3px) center/100% 12px no-repeat,var(--paper)}
  .win:not(.focus) .tbar{background:var(--paper)}
  .tbar .close{width:14px;height:14px;border:2px solid var(--ink);background:var(--paper);flex:none;padding:0}
  .tbar .close:hover{background:var(--hot)}
  .tbar .title{margin:0 auto;background:var(--paper);padding:0 10px;font-family:"Pixelify Sans";font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbar .spacer{width:14px;flex:none}
  .wbody{overflow:auto;flex:1;user-select:text}
  .wbody::-webkit-scrollbar{width:14px}
  .wbody::-webkit-scrollbar-track{background:repeating-linear-gradient(45deg,var(--paper) 0 2px,#e9dfd2 2px 4px);border-left:2px solid var(--ink)}
  .wbody::-webkit-scrollbar-thumb{background:var(--paper);border:2px solid var(--ink)}

  .btn{border:2px solid var(--ink);background:var(--paper);padding:6px 14px;border-radius:8px;font-family:"Pixelify Sans";font-size:15px;box-shadow:2px 2px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  .btn.main{background:var(--hot);color:#fff}
  .btn.full{width:100%}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;border:2px solid var(--ink);background:#fff;padding:6px 8px;width:100%}

  /* shop window */
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);background:var(--pink);flex-wrap:wrap}
  .tab{border:0;border-right:2px solid var(--ink);background:none;padding:6px 12px;font-family:"Pixelify Sans";font-size:14px}
  .tab.on{background:var(--paper)}
  .shopbar{display:flex;gap:8px;padding:10px;border-bottom:1px dashed var(--ink);align-items:center}
  .shopbar input{max-width:220px}
  .shopbar select{max-width:170px}
  .shopbar .n{margin-left:auto;opacity:.7;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px}
  .item{border:2px solid var(--ink);background:#fff;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
  .item:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
  .item .th{aspect-ratio:1;display:grid;place-items:center;border-bottom:2px solid var(--ink);position:relative;width:100%}
  .item .nm{font-family:"Pixelify Sans";font-size:14px;font-weight:600;padding:6px 8px 0;line-height:1.15}
  .item .pr{padding:2px 8px 8px;font-size:12px}
  .item .pr s{opacity:.5;margin-left:4px}
  .badge{position:absolute;top:6px;left:6px;font-family:Silkscreen;font-size:10px;background:var(--butter);border:2px solid var(--ink);padding:1px 5px}
  .badge.out{background:var(--ink);color:var(--paper)}
  .badge.sale{background:var(--coral)}
  .sold{opacity:.55}

  /* product window */
  .pv{display:grid;grid-template-columns:1fr 1fr}
  .pv .th{display:grid;place-items:center;border-right:2px solid var(--ink);min-height:300px}
  .pv .meta{padding:16px;display:flex;flex-direction:column;gap:10px}
  .pv h2{font-family:Silkscreen;font-size:20px;line-height:1.1}
  .lbl{font-family:"Pixelify Sans";font-weight:600;font-size:14px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .sw{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;padding:0}
  .sw.on{outline:2px dashed var(--ink);outline-offset:2px}
  .sz{min-width:40px;height:32px;border:2px solid var(--ink);background:#fff;font-family:"Pixelify Sans";font-size:14px}
  .sz.on{background:var(--ink);color:var(--paper)}
  .hint{color:var(--hot);min-height:16px;font-size:12px}

  /* cart */
  .cline{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px dashed var(--ink)}
  .cline .mini{width:52px;height:52px;border:2px solid var(--ink);display:grid;place-items:center}
  .qty{display:flex;gap:6px;align-items:center;margin-top:4px}
  .qty button{width:22px;height:22px;border:2px solid var(--ink);background:#fff;padding:0;line-height:1}
  .link{border:0;background:none;text-decoration:underline;font-size:12px;opacity:.7}
  .tot{padding:12px;display:grid;gap:6px}
  .row{display:flex;justify-content:space-between}
  .row.big{font-family:"Pixelify Sans";font-size:18px;font-weight:600}
  .meter{height:14px;border:2px solid var(--ink);background:#fff}
  .meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--mint) 0 6px,var(--sky) 6px 12px)}

  /* radio */
  .radio{padding:14px;display:grid;gap:12px;background:linear-gradient(180deg,var(--pink),var(--paper) 60%)}
  .screen{background:var(--ink);color:var(--butter);padding:10px 12px;font-family:"Pixelify Sans";font-size:15px;border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #4a3f38}
  .screen small{display:block;color:var(--mint);font-size:12px;opacity:.9}
  .eq{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:8px}
  .eq i{flex:1;background:var(--coral);height:10%;transition:height .12s}
  .controls{display:flex;gap:8px;align-items:center}
  .controls .btn{min-width:44px}
  .stations{display:grid;gap:4px}
  .st{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:#fff;padding:6px 8px;text-align:left;font-family:"Pixelify Sans";font-size:14px}
  .st.on{background:var(--butter)}
  .st small{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;opacity:.6}
  input[type=range]{padding:0;border:0;background:none;accent-color:var(--hot)}

  .about{padding:16px;display:grid;gap:10px;line-height:1.55}
  .about h2{font-family:Silkscreen;font-size:18px}
  .dlg{padding:18px;display:grid;gap:12px;text-align:center}
  .dlg .sun{font-size:34px}

  .confetti{position:fixed;top:-20px;z-index:900;pointer-events:none;animation:fall linear forwards;font-size:18px}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  @media (max-width:700px){
    #nowMini{display:none}
    .menu>button{padding:0 8px}
    .icons{grid-template-columns:repeat(6,1fr);right:auto;left:0;width:100%;top:10px;gap:2px}
    .icon{width:auto;padding:2px}
    .icon .glyph{transform:scale(.72);height:40px}
    .icon span{font-size:10px;padding:1px 2px}
    .win{left:6px!important;right:6px;width:auto!important;top:110px!important;max-height:calc(100% - 120px)}
    .tbar{cursor:default}
    .pv{grid-template-columns:1fr}
    .pv .th{border-right:0;border-bottom:2px solid var(--ink);min-height:220px}
    .hello{display:none}
  }
</style>
</head>
<body>

<div id="boot">
  <div class="bootbox">
    <div class="sun">☀︎</div>
    <h1>NORTHLINE</h1>
    <div class="px" style="font-size:15px">Summer Supply Co.</div>
    <div class="loadbar"><i id="loadI"></i></div>
    <div id="bootMsg">Inflating pool floats…</div>
  </div>
</div>

<div class="menubar" id="menubar">
  <div class="menu"><button>☀︎</button><div class="drop">
    <button data-open="about">About Northline</button><hr>
    <button data-open="radio">Northline FM</button>
  </div></div>
  <div class="menu"><button>Shop</button><div class="drop">
    <button data-cat="All">Everything</button>
    <button data-cat="Tops">Tops</button>
    <button data-cat="Bottoms">Bottoms</button>
    <button data-cat="Outerwear">Outerwear</button>
    <button data-cat="Accessories">Accessories</button><hr>
    <button data-cat="Sale">On sale</button>
  </div></div>
  <div class="menu"><button>Radio</button><div class="drop">
    <button data-open="radio">Open player</button>
    <button id="mPlay">Play / Pause <span>␣</span></button>
  </div></div>
  <div class="menu"><button>Help</button><div class="drop">
    <button data-open="ship">Shipping & returns</button>
    <button data-open="sizes">Size guide</button>
  </div></div>
  <div class="mb-right">
    <span id="nowMini"></span>
    <button data-open="cart">🛍 <span id="count">0</span></button>
    <span id="clock"></span>
  </div>
</div>

<div id="desk">
  <div class="hello">
    <div class="big">Endless<br>summer.</div>
    <p>Pick an icon to start shopping ☀︎</p>
  </div>
  <div class="icons" id="icons"></div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const PRODUCTS=[
  {id:1,name:"Pool Party Tee",cat:"Tops",price:38,desc:"Soft boxy tee in heavyweight cotton with a sunny smile print. Built for long afternoons by the water.",shape:"tee",print:"smile",bg:"#f6d5d5",colors:[["Cream","#fffaf3"],["Mint","#bfe6d3"],["Sky","#bcdff5"]],sizes:["XS","S","M","L","XL"],tag:"New"},
  {id:2,name:"Sunset Hoodie",cat:"Tops",price:78,desc:"Garment-dyed fleece hoodie with a flower puff print. Throw it on when the sun drops.",shape:"hoodie",print:"flower",bg:"#fbe7a1",colors:[["Coral","#f2a490"],["Lilac","#d6c8f0"],["Cream","#fffaf3"]],sizes:["S","M","L","XL"],tag:"Bestseller"},
  {id:3,name:"Lucky Star Tee",cat:"Tops",price:32,was:42,desc:"Washed cotton tee with a chunky star graphic and a broken-in feel.",shape:"tee",print:"star",bg:"#bfe6d3",colors:[["Pink","#f6d5d5"],["Butter","#fbe7a1"]],sizes:["S","M","L","XL"]},
  {id:4,name:"Cabana Knit Vest",cat:"Tops",price:84,desc:"Loose-knit button vest with a zigzag stitch. Great over a tee, better over nothing.",shape:"vest",bg:"#d6c8f0",colors:[["Butter","#fbe7a1"],["Mint","#bfe6d3"]],sizes:["S","M","L","XL"],tag:"Low stock"},
  {id:5,name:"Deep End Swim Short",cat:"Bottoms",price:52,desc:"Quick-dry swim short with a mesh liner, a 6\" inseam and a coin pocket.",shape:"shorts",bg:"#bcdff5",colors:[["Coral","#f2a490"],["Pink","#f6d5d5"],["Mint","#bfe6d3"]],sizes:["S","M","L","XL"]},
  {id:6,name:"Boardwalk Pant",cat:"Bottoms",price:88,desc:"Relaxed linen-blend pant with a drawstring waist and a wide leg.",shape:"pants",bg:"#f2a490",colors:[["Cream","#fffaf3"],["Sky","#bcdff5"]],sizes:["28","30","32","34","36"]},
  {id:7,name:"Lifeguard Windbreaker",cat:"Outerwear",price:110,was:128,desc:"Color-blocked nylon windbreaker that packs into its own pocket.",shape:"zip",bg:"#fbe7a1",colors:[["Coral","#f2a490"],["Sky","#bcdff5"]],sizes:["S","M","L","XL"]},
  {id:8,name:"After Hours Puffer",cat:"Outerwear",price:158,desc:"Light quilted puffer for cool nights on the deck. Warm, packable and very pink.",shape:"jacket",bg:"#bfe6d3",colors:[["Pink","#f6d5d5"],["Lilac","#d6c8f0"]],sizes:["S","M","L","XL"]},
  {id:9,name:"Shade Club Cap",cat:"Accessories",price:34,desc:"Washed six-panel cap with an embroidered star and a curved brim.",shape:"cap",bg:"#f6d5d5",colors:[["Sky","#bcdff5"],["Butter","#fbe7a1"]],sizes:["One size"]},
  {id:10,name:"Fuzzy Beanie",cat:"Accessories",price:30,desc:"Mohair-blend beanie for when summer ends. Static hair included.",shape:"beanie",bg:"#bcdff5",colors:[["Coral","#f2a490"],["Mint","#bfe6d3"]],sizes:["One size"]},
  {id:11,name:"Flip Flop Socks 3-Pk",cat:"Accessories",price:22,desc:"Three pastel pairs of cushioned crew socks. Mix and match, nobody's checking.",shape:"socks",bg:"#d6c8f0",colors:[["Pastel","#fbe7a1"]],sizes:["S/M","L/XL"]},
  {id:12,name:"First Swim Tee",cat:"Tops",price:40,soldOut:true,desc:"The one that started it all. Sold out, but restocks land on Fridays.",shape:"tee",print:"star",bg:"#fffaf3",colors:[["Coral","#f2a490"]],sizes:["S","M","L","XL"]},
];

/* =========================================================
   ART
   ========================================================= */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v));return "#"+((1<<24)+(c((n>>16)+amt)<<16)+(c((n>>8&255)+amt)<<8)+c((n&255)+amt)).toString(16).slice(1)}
const PR={
  smile:`<circle cx="100" cy="105" r="20" fill="#fbe7a1" stroke="#2a2420" stroke-width="4"/><circle cx="93" cy="100" r="3" fill="#2a2420"/><circle cx="107" cy="100" r="3" fill="#2a2420"/><path d="M91 109 Q100 118 109 109" fill="none" stroke="#2a2420" stroke-width="4" stroke-linecap="round"/>`,
  star:`<path d="M100 82 L107 98 L124 99 L111 109 L115 126 L100 117 L85 126 L89 109 L76 99 L93 98Z" fill="#e8577a" stroke="#2a2420" stroke-width="4" stroke-linejoin="round"/>`,
  flower:[0,72,144,216,288].map(a=>`<circle cx="${(100+13*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(96+13*Math.sin(a*Math.PI/180)).toFixed(1)}" r="10" fill="#fffaf3" stroke="#2a2420" stroke-width="3"/>`).join("")+`<circle cx="100" cy="96" r="7" fill="#fbe7a1" stroke="#2a2420" stroke-width="3"/>`
};
function art(p,color,size=150){
  const d=shade(color,-30), s=`stroke="#2a2420" stroke-width="5" stroke-linejoin="round"`, pr=p.print?PR[p.print]:"";
  const S={
    tee:`<path d="M60 40 L85 30 Q100 44 115 30 L140 40 L166 72 L145 88 L135 78 L135 166 L65 166 L65 78 L55 88 L34 72 Z" fill="${color}" ${s}/>${pr}`,
    zip:`<path d="M58 42 L84 30 L116 30 L142 42 L168 122 L150 128 L136 86 L136 168 L64 168 L64 86 L50 128 L32 122 Z" fill="${color}" ${s}/><path d="M64 110 L136 110 L136 168 L64 168Z" fill="${d}" ${s}/><line x1="100" y1="32" x2="100" y2="168" stroke="#2a2420" stroke-width="4"/>`,
    hoodie:`<path d="M56 50 L80 36 L120 36 L144 50 L168 130 L150 136 L136 92 L136 170 L64 170 L64 92 L50 136 L32 130 Z" fill="${color}" ${s}/><path d="M78 40 Q100 2 122 40 Q100 60 78 40Z" fill="${d}" ${s}/><rect x="74" y="128" width="52" height="28" rx="8" fill="${d}" ${s}/>${pr}`,
    pants:`<path d="M66 28 L134 28 L146 172 L110 172 L100 72 L90 172 L54 172 Z" fill="${color}" ${s}/><rect x="66" y="28" width="68" height="12" fill="${d}" ${s}/>`,
    shorts:`<path d="M56 50 L144 50 L156 144 L108 144 L100 92 L92 144 L44 144 Z" fill="${color}" ${s}/><rect x="56" y="50" width="88" height="14" fill="${d}" ${s}/>${[70,90,110,130].map(x=>`<circle cx="${x}" cy="${x%40?112:96}" r="5" fill="#fffaf3" stroke="#2a2420" stroke-width="2"/>`).join("")}`,
    jacket:`<path d="M48 48 Q50 30 82 28 L118 28 Q150 30 152 48 L172 132 L148 140 L140 96 L140 168 L60 168 L60 96 L52 140 L28 132 Z" fill="${color}" ${s}/>${[70,95,120,145].map(y=>`<path d="M60 ${y} Q100 ${y+8} 140 ${y}" fill="none" stroke="${d}" stroke-width="4"/>`).join("")}<path d="M78 28 Q100 8 122 28 L118 44 L82 44Z" fill="${d}" ${s}/><line x1="100" y1="44" x2="100" y2="168" stroke="#2a2420" stroke-width="4"/>`,
    vest:`<path d="M70 32 L88 32 Q100 54 112 32 L130 32 L140 80 L140 170 L60 170 L60 80 Z" fill="${color}" ${s}/>${[70,100,130,155].map(y=>`<path d="M60 ${y} l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8" fill="none" stroke="${d}" stroke-width="4"/>`).join("")}${[60,90,120,150].map(y=>`<circle cx="104" cy="${y}" r="5" fill="#fffaf3" stroke="#2a2420" stroke-width="2"/>`).join("")}`,
    beanie:`<path d="M46 130 Q46 46 100 46 Q154 46 154 130 Z" fill="${color}" ${s}/><circle cx="100" cy="42" r="16" fill="${d}" ${s}/><rect x="40" y="118" width="120" height="34" rx="8" fill="${d}" ${s}/>`,
    socks:`<path d="M70 28 L102 28 L102 118 Q102 148 132 148 L150 148 Q166 170 140 174 L88 174 Q62 172 68 128 Z" fill="${color}" ${s}/><rect x="70" y="28" width="32" height="18" fill="#f2a490" ${s}/><rect x="70" y="58" width="32" height="10" fill="#bcdff5" stroke="#2a2420" stroke-width="3"/>`,
    cap:`<path d="M48 122 Q48 56 100 56 Q152 56 152 122 Z" fill="${color}" ${s}/><path d="M36 118 Q100 104 174 126 Q164 146 120 140 L48 130Z" fill="${d}" ${s}/><path d="M100 76 L104 86 L115 86 L106 93 L109 104 L100 97 L91 104 L94 93 L85 86 L96 86Z" fill="#e8577a" stroke="#2a2420" stroke-width="2"/>`
  };
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" aria-hidden="true">${S[p.shape]}</svg>`;
}
const ICONS={

/* =========================================================
   NORTHLINE FM: synthesized summer radio (Web Audio)
   ========================================================= */
const STATIONS=[
  {name:"Poolside Chords",sub:"lazy afternoon keys",bpm:86,wave:"triangle",prog:[[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,62]],arp:false},
  {name:"Sunset Arp",sub:"golden hour synths",bpm:104,wave:"sine",prog:[[60,64,67,71],[57,60,64,67],[62,65,69,72],[55,59,62,67]],arp:true},
  {name:"Night Swim",sub:"slow, deep and blue",bpm:72,wave:"sine",prog:[[50,57,60,65],[48,55,58,64],[53,57,60,64],[52,55,59,62]],arp:false},
];
let ac=null,master,playing=false,station=0,timer=null,step=0,nextT=0,vol=.6,analyser;
const TRACKS=["Inflatable Dreams","Pool Noodle Funk","SPF 50 (Extended)","Cabana Boy","Ice Cube Melt","Chlorine Kiss","Lounge Chair Romance"];
let track=TRACKS[0];
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=vol*.5;
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
  const dl=ac.createDelay();dl.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.28;
  analyser=ac.createAnalyser();analyser.fftSize=64;
  master.connect(lp);lp.connect(analyser);analyser.connect(ac.destination);
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(analyser);
}
function note(m,t,dur,type,g=.12){
  const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=hz(m);
  o.detune.value=(Math.random()-.5)*8;
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.04);e.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(e);e.connect(master);o.start(t);o.stop(t+dur+.05);
}
function kick(t){const o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
  e.gain.setValueAtTime(.35,t);e.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(e);e.connect(master);o.start(t);o.stop(t+.3)}
function hat(t){const len=ac.sampleRate*.04,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource();s.buffer=buf;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=7000;const g=ac.createGain();g.gain.value=.06;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
function schedule(){
  const st=STATIONS[station], eighth=60/st.bpm/2;
  while(nextT<ac.currentTime+.2){
    const bar=Math.floor(step/8)%st.prog.length, pos=step%8, ch=st.prog[bar];
    if(pos===0){ch.forEach(m=>note(m,nextT,eighth*7.5,st.wave,.07));note(ch[0]-12,nextT,eighth*3,"sine",.16)}
    if(pos===4)note(ch[0]-12,nextT,eighth*3,"sine",.12);
    if(st.arp)note(ch[pos%4]+12,nextT,eighth*.9,"square",.025);
    else if(pos===3||pos===6)note(ch[(pos+step)%4]+12,nextT,eighth*2,"triangle",.05);
    if(pos===0||pos===4)kick(nextT); if(pos%2===1)hat(nextT);
    nextT+=eighth*(pos%2?0.9:1.1); step++;
    if(step%64===0){track=TRACKS[Math.floor(Math.random()*TRACKS.length)];updateRadio()}
  }
}
function play(){ if(!ac)initAudio(); ac.resume(); playing=true; nextT=ac.currentTime+.05; clearInterval(timer); timer=setInterval(schedule,50); updateRadio(); }
function pause(){ playing=false; clearInterval(timer); updateRadio(); }
function toggle(){ playing?pause():play() }
function setStation(i){ station=i; step=0; track=TRACKS[(i*2)%TRACKS.length]; if(playing){nextT=ac.currentTime+.05} updateRadio(); }
function openRadio(){openWin("radio","Northline FM",{w:330,x:mobile()?6:Math.max(10,desk.clientWidth-460),y:mobile()?110:Math.max(20,desk.clientHeight-470),render:renderRadio})}
function renderRadio(b){
  b.innerHTML=`<div class="radio">
    <div class="screen"><small>☀︎ NORTHLINE FM · ${STATIONS[station].name.toUpperCase()}</small><div id="trk">${playing?"♪ "+track:"Paused. Press play"}</div>
      <div class="eq" id="eq">${"<i></i>".repeat(16)}</div></div>
    <div class="controls"><button class="btn" id="prev">⏮</button><button class="btn main" id="pp">${playing?"❚❚":"▶"}</button><button class="btn" id="next">⏭</button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="${vol}" aria-label="Volume"></div>
    <div class="stations">${STATIONS.map((s,i)=>`<button class="st ${i===station?'on':''}" data-st="${i}">${i===station&&playing?"♪":"○"} ${s.name}<small>${s.sub}</small></button>`).join("")}</div>
    <p style="font-size:11px;opacity:.7">All music is generated live in your browser.</p></div>`;
  b.querySelector("#pp").onclick=toggle;
  b.querySelector("#prev").onclick=()=>setStation((station+STATIONS.length-1)%STATIONS.length);
  b.querySelector("#next").onclick=()=>setStation((station+1)%STATIONS.length);
  b.querySelector("#vol").oninput=e=>{vol=+e.target.value;if(master)master.gain.value=vol*.5};
  b.querySelectorAll("[data-st]").forEach(x=>x.onclick=()=>{setStation(+x.dataset.st);if(!playing)play()});
}
function updateRadio(){rerender("radio",renderRadio);$("nowMini").textContent=playing?"♪ "+track+" · Northline FM":""}
(function eqLoop(){
  const eq=document.getElementById("eq");
  if(eq&&analyser&&playing){const d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);
    [...eq.children].forEach((bar,i)=>bar.style.height=Math.max(6,d[i+1]/255*100)+"%")}
  else if(eq)[...eq.children].forEach(bar=>bar.style.height="8%");
  requestAnimationFrame(eqLoop);
})();

clock();setInterval(clock,10000);

function sparkle(n,set=["☀︎","✿","★","●"]){
  const cols=["#e8577a","#f2a490","#bfe6d3","#bcdff5","#fbe7a1","#d6c8f0"];
  for(let i=0;i<n;i++){const e=document.createElement("div");e.className="confetti";e.textContent=set[i%set.length];
    e.style.left=Math.random()*100+"vw";e.style.color=cols[i%cols.length];e.style.fontSize=(14+Math.random()*20)+"px";
    e.style.animationDuration=(1.8+Math.random()*1.8)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
}

const BOOT=["Inflating pool floats…","Applying sunscreen…","Chilling lemonade…","Ready. Click anywhere ☀︎"];
let bi=0; requestAnimationFrame(()=>$("loadI").style.width="100%");
const bt=setInterval(()=>{bi++;$("bootMsg").textContent=BOOT[Math.min(bi,3)];if(bi>=3)clearInterval(bt)},450);
let booted=false;
function enter(withMusic){if(booted)return;booted=true;$("boot").classList.add("gone");openShop("All");if(!mobile())openRadio();if(withMusic)play()}
$("boot").onclick=()=>enter(true);
setTimeout(()=>{if(!booted){$("bootMsg").textContent="Ready. Click anywhere to enter (with music) ☀︎"}},1500);
saveCart();
</script>
